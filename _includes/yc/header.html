{%- assign home = '/' | relative_url -%}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ home }}" aria-label="{{ site.author.name }} — home">
      <span class="brand__mark" aria-hidden="true">yc</span>
      <span class="brand__name">{{ site.author.name }}</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ home }}#research">Research</a>
      <a href="{{ home }}#publications">Publications</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
      <a href="{{ home }}#contact">Contact</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
