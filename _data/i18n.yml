  sections: { about: "About", research: "Research", publications: "Publications", experience: "Experience", contact: "Contact" }

  about:
    - >-
      I’m a quantitative researcher in the Financial Computing &amp; Analytics Group at
      UCL, where I recently finished a First Class MEng in Computer Science. I’m interested in
      what happens when the structure we already know about financial data — dependence
      between firm characteristics, the shape of a limit order book — is built directly into a
      model, instead of being left for it to rediscover from noisy samples.
    - >-
      That has meant dependence-informed sparse networks for cross-sectional return prediction
      (<a href="#lin2026dependence">ACM ICAIF 2026</a>), a thesis with Prof. Tomaso Aste on how
      graph-aligned architectures and attention generalise in high dimensions, and short-horizon
      research on European natural-gas futures with Centiva Capital and A2A — where a key
      finding was that statistically measurable predictability doesn’t reliably survive
      spreads, latency and transaction costs.
    - >-
      Originally from Hainan, now in London. Away from the screen I’m usually behind a camera,
      or hunting for something good to eat.

  interests:
    - title: "Structure-aware learning"
      text: >-
        Building known or estimated dependence — graphs, cliques, hierarchies — into network
        wiring and attention, so models learn from fewer samples and stay interpretable.
    - title: "Empirical asset pricing with ML"
      text: >-
        Cross-sectional return prediction from firm characteristics, judged by honest
        out-of-sample ranking rather than in-sample fit.
    - title: "Market microstructure"
      text: >-
        Short-horizon signals in limit order books, and the gap between statistical
        predictability and executable, cost-aware profit.

  more_cv: "Full CV"
  contact_lead: >-
    Open to quantitative research and machine learning roles.
    The quickest way to reach me is email.

