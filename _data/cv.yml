research:
  - org: "Financial Computing & Analytics Group, UCL"
    role: "Quantitative Researcher"
    context: "Energy-futures market microstructure, with Centiva Capital and A2A S.p.A."
    dates: "Jun 2025 — Present"
    location: "London, UK"
    points:
      - "Investigated whether short-horizon price movements in TTF natural-gas futures are predictably related to order-book and trade dynamics, using second-level L2 depth and tick-level trades across the 2020–2026 history."
      - "Designed rolling walk-forward experiments to test signal robustness out of sample, evaluating microstructure, liquidity, flow and price-path information across horizons and market regimes; TabPFN achieved approximately 0.10 mean daily out-of-sample Spearman IC for 60-minute mid-price forecasts."
      - "Tested whether statistical predictability survived realistic trading constraints, decomposing forecast quality from execution effects including spread, latency, fill assumptions and transaction costs; found that measurable alpha did not consistently translate into positive executable P&L."
      - "Built an end-to-end Python research framework for high-frequency data processing, feature construction, ML/DL benchmarking, walk-forward validation and execution-aware backtesting."

  - org: "University College London"
    role: "MEng Thesis · supervised by Prof. Tomaso Aste"
    context: "Structural inductive biases, high-dimensional generalisation and graph-structured attention."
    dates: "Sep 2025 — Apr 2026"
    location: "London, UK"
    points:
      - "Built a controlled experimental framework with known interaction graphs, systematically perturbing network connectivity while holding depth, parameter count and sparsity fixed."
      - "Showed that out-of-sample R² degrades monotonically as connectivity diverges from the true compositional structure; additional capacity and ℓ1-induced sparsity did not recover the aligned model’s finite-sample advantage."
      - "Extended the result to FT-Transformer, where graph-aligned attention consistently outperformed dense attention and sparsity-matched random masks, particularly in low- and intermediate-sample regimes."

