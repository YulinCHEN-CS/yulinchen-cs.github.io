  - org: "University College London"
    role: "MEng Thesis · supervised by Prof. Tomaso Aste"
    context: "Structural inductive biases, high-dimensional generalisation and graph-structured attention."
    dates: "Sep 2025 — Apr 2026"
    location: "London, UK"
    points:
      - "Built a controlled experimental framework with known interaction graphs, systematically perturbing network connectivity while holding depth, parameter count and sparsity fixed."
      - "Showed that out-of-sample R² degrades monotonically as connectivity diverges from the true compositional structure; additional capacity and ℓ1-induced sparsity did not recover the aligned model’s finite-sample advantage."
      - "Extended the result to FT-Transformer, where graph-aligned attention consistently outperformed dense attention and sparsity-matched random masks, particularly in low- and intermediate-sample regimes."

