# Site settings
# This file is NOT reloaded by `jekyll serve` — restart the server after editing.

title       : "Yulin (Stephen) Chen"
description : "Quantitative researcher working at the intersection of machine learning and quantitative finance."
url         : "https://yulinchen-cs.github.io"
baseurl     : ""
locale      : "en_GB"
timezone    : Europe/London

# Contact details and links. Page copy in both languages lives in _data/i18n.yml.
author:
  name        : "Yulin Chen"
  name_zh     : "陈昱霖"
  nickname    : "Stephen"
  full_name   : "Yulin (Stephen) Chen"
  email       : "stephen.yulin.chen@gmail.com"
  github      : "YulinChen-CS"
  linkedin    : "stephen-ychen"
  scholar     : "https://scholar.google.com/citations?user=_VhS_CwAAAAJ"
  portrait    : "/images/photo_720*720.png"

# Build
markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo

permalink: pretty

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
