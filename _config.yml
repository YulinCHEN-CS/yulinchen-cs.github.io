# Site settings
# This file is NOT reloaded by `jekyll serve` — restart the server after editing.

title       : "Yulin (Stephen) Chen"
description : "Machine learning researcher working at the intersection of machine learning and quantitative finance."
url         : "https://yulinchen-cs.github.io"
baseurl     : ""
locale      : "en_GB"
timezone    : Europe/London

# Shown on the home page, CV header and footer.
author:
  name        : "Yulin Chen"
  nickname    : "Stephen"
  full_name   : "Yulin (Stephen) Chen"
  role        : "Machine learning × quantitative finance"
  location    : "London, UK"
  email       : "stephen.yulin.chen@gmail.com"
  github      : "YulinChen-CS"
  linkedin    : "stephen-ychen"
  scholar     : ""      # e.g. "https://scholar.google.com/citations?user=XXXX"
  portrait    : "/images/photo_720*720.png"

# Shown on the CV page as "Updated <month year>". Bump when the CV changes.
cv_updated: "October 2026"

# Build
markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo

permalink: pretty

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
